<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CouchPlay — Free Couch Gaming Console</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232f9bff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9h12a4 4 0 0 1 4 4v2a3 3 0 0 1-5.5 1.7L15 15H9l-1.5 1.7A3 3 0 0 1 2 15v-2a4 4 0 0 1 4-4z'/></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="landing">
  <div class="logo">Couch<em>Play</em></div>
  <p class="tagline">Your free living-room console. One big screen, everyone's phone is a controller.<br>16 games &middot; up to 8 players &middot; no downloads, no accounts.</p>
  <div class="landing-choices">
    <button class="choice" onclick="location.href='console.html'">
      <div class="big" id="icoTv"></div>
      <h2>Open Console</h2>
      <p>Put this on the TV, laptop, or any big screen. It creates a room code + QR code and runs the games.</p>
    </button>
    <button class="choice" onclick="location.href='controller.html'">
      <div class="big" id="icoPhone"></div>
      <h2>Join as Player</h2>
      <p>Open this on your phone or tablet. Type the room code (or scan the QR on the TV) and it becomes your controller.</p>
    </button>
  </div>
</div>
<script src="js/icons.js"></script>
<script>
  document.getElementById('icoTv').innerHTML = ICONS.tv;
  document.getElementById('icoPhone').innerHTML = ICONS.phone;
  // If someone scanned a QR that points at the root with ?room=CODE, send them to the controller.
  const room = new URLSearchParams(location.search).get('room');
  if (room) location.replace('controller.html?room=' + encodeURIComponent(room));
</script>
</body>
</html>
