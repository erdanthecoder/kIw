<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CouchPlay Console</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232f9bff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9h12a4 4 0 0 1 4 4v2a3 3 0 0 1-5.5 1.7L15 15H9l-1.5 1.7A3 3 0 0 1 2 15v-2a4 4 0 0 1 4-4z'/></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="ps-lobby" id="lobby">
  <div class="ps-glow" id="psGlow"></div>
  <div class="ps-top">
    <div class="logo small">Couch<em>Play</em></div>
    <div class="game-row" id="gameRow"></div>
    <div class="ps-status">
      <button id="langBtn" class="lang-btn">RU</button>
      <span class="net-dot" id="netBadge" title=""></span>
      <span id="clock"></span>
    </div>
  </div>

  <div class="ps-hero">
    <div class="hero-info">
      <div class="hero-icon" id="heroIcon"></div>
      <h1 id="heroTitle"></h1>
      <p class="hero-desc" id="heroDesc"></p>
      <div class="hero-meta" id="heroMeta"></div>
      <div class="hero-hint" id="heroHint"></div>
      <p class="ps-hint" id="psHint"></p>
    </div>
    <div class="hero-side">
      <div class="side-card">
        <h3 id="joinHead">JOIN THE ROOM</h3>
        <div class="room-code" id="roomCode">····</div>
        <div id="qr"></div>
        <div class="join-url" id="joinUrl"></div>
      </div>
      <div class="side-card">
        <h3 id="lbHead">LEADERBOARD</h3>
        <div class="lb-list" id="leaderboard"></div>
      </div>
    </div>
  </div>

  <div class="ps-bottom" id="playerCards"></div>
</div>

<div id="stage">
  <canvas id="gameCanvas" width="1280" height="720"></canvas>
  <div id="glWrap" style="display:none; position:absolute; inset:0;"></div>
</div>
<div id="gameHud" style="display:none">
  <span class="title" id="hudTitle"></span>
  <span class="spacer"></span>
  <button id="endBtn">End game (Esc)</button>
</div>

<div class="overlay" id="countOverlay"><div class="huge" id="countNum">3</div><div class="sub" id="countGame"></div></div>
<div class="overlay" id="resultsOverlay">
  <h1 id="resultsTitle">Results</h1>
  <div class="results-wrap">
    <div class="podium" id="podium"></div>
    <div class="side-card results-lb">
      <h3 id="resultsLbHead">LEADERBOARD</h3>
      <div class="lb-list" id="resultsLb"></div>
    </div>
  </div>
  <button id="backBtn" onclick="App.toLobby()">Back to lobby</button>
</div>
<div class="toast" id="toast"></div>

<script src="lib/peerjs.min.js"></script>
<script src="lib/qrcode.min.js"></script>
<script src="lib/three.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="js/net.js"></script>
<script src="js/engine3d.js"></script>
<script src="js/console-app.js"></script>
<!-- games (host side) -->
<script src="js/games/minecraft.js"></script>
<script src="js/games/obby.js"></script>
<script src="js/games/flappy.js"></script>
<script src="js/games/snake.js"></script>
<script src="js/games/tanks.js"></script>
<script src="js/games/bomber.js"></script>
<script src="js/games/laser.js"></script>
<script src="js/games/trivia.js"></script>
<script src="js/games/draw.js"></script>
<script src="js/games/reaction.js"></script>
<script src="js/games/soccer.js"></script>
<script src="js/games/race.js"></script>
<script src="js/games/pong.js"></script>
<script src="js/games/tetris.js"></script>
<script src="js/games/blob.js"></script>
<script src="js/games/dodge.js"></script>
<script>App.boot();</script>
</body>
</html>
